name: Wiki

# Überträgt den Ordner wiki/ ins GitHub-Wiki des Repositorys.
# Voraussetzung: Das Wiki ist in den Repo-Einstellungen aktiviert und hat
# mindestens eine (beliebige) Seite, damit das Wiki-Repository existiert.
on:
  push:
    branches: ["main"]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nötig zum Pushen ins Wiki-Repository
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Wiki aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git" wiki-repo
          rsync -a --delete --exclude '.git' wiki/ wiki-repo/
          cd wiki-repo
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki ist bereits aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wiki aus ${SHA::7} aktualisiert"
          git push
