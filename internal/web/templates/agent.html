<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<title>DockPilot · Agent</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:#0b0d17;color:#e7e9f3;display:flex;min-height:100vh;
  align-items:center;justify-content:center}
.wrap{width:480px;padding:1rem}
.logo{text-align:center;font-size:1.5rem;font-weight:700;margin-bottom:.4rem}
.logo{display:flex;align-items:center;justify-content:center}
.badge{display:inline-flex;align-items:center;gap:.4rem;background:rgba(127,119,221,.1);
  border:1px solid rgba(127,119,221,.25);border-radius:20px;padding:.3rem .8rem;
  font-size:.78rem;color:#8f88e6;margin-bottom:1.5rem}
.card{background:#141829;border:1px solid #252b45;
  border-radius:16px;padding:1.75rem;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h2{margin:0 0 .4rem;font-size:1rem;font-weight:700;color:#e7e9f3}
.row{display:flex;justify-content:space-between;align-items:center;padding:.55rem 0;
  border-bottom:1px solid #1b2036;font-size:.85rem}
.row:last-child{border-bottom:0}
.lbl{color:#a5abc4}
.val{color:#e7e9f3;font-family:monospace;font-size:.82rem;word-break:break-all;text-align:right;max-width:60%}
.val.ok{color:#46c486}
.val.warn{color:#fbbf24}
</style></head>
<body><div class="wrap" style="text-align:center">
<div class="logo"><img src="/static/logo.svg" alt="" width="34" height="34" style="vertical-align:middle;margin-right:10px">DockPilot</div>
<div style="margin:.4rem 0 1.2rem">
  <span class="badge">● Agent-Modus aktiv</span>
</div>
<div class="card" style="text-align:left">
  <h2>Agent-Status</h2>
  <div class="row"><span class="lbl">Modus</span><span class="val ok">Agent (Client)</span></div>
  <div class="row"><span class="lbl">Hub-Verbindung</span><span class="val" id="hub-status">Prüfe…</span></div>
  <div class="row"><span class="lbl">Hub-URL</span><span class="val" id="hub-url">–</span></div>
  <div class="row"><span class="lbl">Agent-Name</span><span class="val" id="agent-name">–</span></div>
  <div class="row"><span class="lbl">Eigene URL</span><span class="val" id="agent-url">–</span></div>
  <div class="row"><span class="lbl">API-Endpunkt</span><span class="val ok">/api/*</span></div>
</div>
<div id="hub-error" style="margin-top:.75rem;font-size:.78rem;color:#ec6b6a;display:none"></div>
<div style="margin-top:1rem;font-size:.78rem;color:#6c7391">
  Dieser Server ist als Agent eingerichtet. Das vollständige Dashboard ist auf dem Hub-Server verfügbar.
</div>
<details style="margin-top:1.25rem;text-align:left">
  <summary style="cursor:pointer;font-size:.8rem;color:#a5abc4;user-select:none;padding:.25rem 0">⚙ Konfiguration anzeigen und bearbeiten</summary>
  <div style="margin-top:.75rem;display:flex;flex-direction:column;gap:.5rem">
    <label for="cur-token" style="font-size:.75rem;color:#a5abc4">Aktueller Agent-Token (zum Anzeigen und Ändern nötig)</label>
    <div style="display:flex;gap:.5rem">
      <input id="cur-token" type="password" autocomplete="off" style="flex:1;background:#1b2036;border:1px solid #252b45;color:#e7e9f3;border-radius:6px;padding:.4rem .6rem;font-family:monospace;font-size:.82rem">
      <button onclick="unlock()" style="background:#1b2036;color:#e7e9f3;border:1px solid #252b45;border-radius:7px;padding:.4rem .9rem;font-size:.8rem;cursor:pointer">Anzeigen</button>
    </div>
    <div id="edit-fields" style="display:none;flex-direction:column;gap:.5rem">
      <label for="edit-hub-url" style="font-size:.75rem;color:#a5abc4">Hub-URL</label>
      <input id="edit-hub-url" type="text" placeholder="https://hub.example.com" style="background:#1b2036;border:1px solid #252b45;color:#e7e9f3;border-radius:6px;padding:.4rem .6rem;font-size:.82rem;width:100%">
      <label for="edit-agent-url" style="font-size:.75rem;color:#a5abc4">Eigene URL</label>
      <input id="edit-agent-url" type="text" placeholder="https://agent.example.com:8080" style="background:#1b2036;border:1px solid #252b45;color:#e7e9f3;border-radius:6px;padding:.4rem .6rem;font-size:.82rem;width:100%">
      <label for="edit-token" style="font-size:.75rem;color:#a5abc4">Neuer Agent-Token (leer = unverändert)</label>
      <input id="edit-token" type="text" autocomplete="off" style="background:#1b2036;border:1px solid #252b45;color:#e7e9f3;border-radius:6px;padding:.4rem .6rem;font-family:monospace;font-size:.82rem;width:100%">
      <label for="edit-name" style="font-size:.75rem;color:#a5abc4">Agent-Name</label>
      <input id="edit-name" type="text" style="background:#1b2036;border:1px solid #252b45;color:#e7e9f3;border-radius:6px;padding:.4rem .6rem;font-size:.82rem;width:100%">
      <div style="display:flex;gap:.5rem;align-items:center;margin-top:.25rem">
        <button onclick="saveAgentConfig()" style="background:#6e66d6;color:#fff;border:none;border-radius:7px;padding:.4rem .9rem;font-size:.8rem;cursor:pointer">Speichern & neu laden</button>
      </div>
    </div>
    <span id="edit-status" role="status" style="font-size:.75rem;color:#a5abc4"></span>
  </div>
</details>
</div>
<script>
// Ohne Agent-Token zeigt die Seite nur, ob der Hub erreichbar ist.
const $=id=>document.getElementById(id);
const authHdr=()=>({'Authorization':'Bearer '+$('cur-token').value.trim()});
function setStatus(t,bad){const st=$('edit-status');st.textContent=t;st.style.color=bad?'#ec6b6a':'#a5abc4';}
async function unlock(){
  if(!$('cur-token').value.trim()){setStatus('Token eingeben',true);return}
  try{
    const r=await fetch('/api/setup/mode',{headers:authHdr()});
    if(!r.ok){setStatus(r.status===401?'Token falsch':'Fehler beim Laden',true);return}
    const j=await r.json();
    $('hub-url').textContent=j.hub_url||'–';
    $('agent-name').textContent=j.agent_name||'–';
    $('edit-hub-url').value=j.hub_url||'';
    $('edit-agent-url').value=j.agent_url||'';
    $('edit-name').value=j.agent_name||'';
    $('edit-fields').style.display='flex';
    setStatus('');
    checkHubStatus();
  }catch(e){setStatus('Netzwerkfehler',true)}
}
async function saveAgentConfig(){
  const hub_url=$('edit-hub-url').value.trim();
  const agent_url=$('edit-agent-url').value.trim();
  const agent_token=$('edit-token').value.trim();
  const agent_name=$('edit-name').value.trim();
  if(!hub_url){setStatus('Hub-URL erforderlich',true);return}
  try{
    const r=await fetch('/api/setup/mode',{method:'POST',headers:{'Content-Type':'application/json',...authHdr()},
      body:JSON.stringify({mode:'agent',hub_url,agent_url,agent_token,agent_name})});
    if(r.ok){setStatus('Gespeichert – lade neu…');setTimeout(()=>location.reload(),1500);}
    else{const j=await r.json().catch(()=>({}));setStatus(j.detail||'Fehler',true);}
  }catch(e){setStatus('Netzwerkfehler',true)}
}
async function checkHubStatus(){
  const el=$('hub-status'),errEl=$('hub-error'),urlEl=$('agent-url');
  const tok=$('cur-token').value.trim();
  try{
    const r=await fetch('/api/agent/hub-status',{headers:tok?authHdr():{}});
    const j=await r.json();
    if('agent_url' in j){urlEl.textContent=j.agent_url||'Nicht gesetzt';urlEl.style.color=j.agent_url?'':'#ec6b6a';}
    if(j.online){
      el.textContent='Online';el.className='val ok';el.style.color='';
      errEl.style.display='none';
    }else{
      el.textContent='Offline';el.className='val';el.style.color='#ec6b6a';
      if(j.error){errEl.textContent='Fehler: '+j.error;errEl.style.display='';}
    }
  }catch(e){el.textContent='Fehler';el.style.color='#ec6b6a';}
}
checkHubStatus();
setInterval(checkHubStatus,30000);
</script></body></html>
